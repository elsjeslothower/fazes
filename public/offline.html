<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Fazes</title>
  <style>
    :root { color-scheme: light dark; --bg: #241820; --fg: #f7e9ec; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 28rem; padding: 1.25rem; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fff6f4; --fg: #3b2228; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet, and there's no network connection.
      Reconnect and try again.</p>
  </main>
</body>
</html>
